<text x="342.8" y="305.0" font-size="11" fill="#333333" text-anchor="middle">draft-chain</text>
<rect x="420.3" y="98.2" width="69.6" height="189.8" fill="#a1662f"><title>mtp+ngram-mod: 59.6</title></rect>
<text x="455.2" y="92.2" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">59.6</text>
<text x="455.2" y="305.0" font-size="11" fill="#333333" text-anchor="middle">mtp+ngram-mod</text>
<rect x="532.7" y="102.0" width="69.6" height="186.0" fill="#5b5b7a"><title>mtp+ngram: 58.4</title></rect>
<text x="567.5" y="96.0" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">58.4</text>
<text x="567.5" y="305.0" font-size="11" fill="#333333" text-anchor="middle">mtp+ngram</text>
<rect x="645.0" y="101.9" width="69.6" height="186.1" fill="#7a6a3a"><title>mtp+ngram-map-k: 58.5</title></rect>

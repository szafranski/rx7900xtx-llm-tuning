<text x="679.8" y="305.0" font-size="11" fill="#333333" text-anchor="middle">mtp+ngram-map-k</text>
<text x="62" y="350" font-size="10" fill="#666666">Source: data/spec-vs-none.jsonl. One run per mode, 19134-token prompt, 1200 tokens generated.</text>
<text x="62" y="363" font-size="10" fill="#666666">Best mode is 1.69x the no-speculation baseline of 35.2 tok/s.</text>
<text x="62" y="376" font-size="10" fill="#666666">Single run per mode: this ranks the modes, it does not establish run-to-run variance.</text>
<text x="62" y="389" font-size="10" fill="#666666">See speculation-soak.svg for the same comparison with repeated runs.</text>
</svg>

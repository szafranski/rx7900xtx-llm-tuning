<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="t">Decode throughput by speculative-decoding mode</title><desc id="d">Bar chart of decode tokens per second for six speculation modes on a dense 27B model.</desc>
<rect width="760" height="380" fill="#ffffff"/>
<text x="62" y="26" font-size="15" font-weight="600" fill="#1a1a1a">Decode throughput by speculative-decoding mode</text>
<text x="62" y="45" font-size="11.5" fill="#555555">tokens/s generated, higher is better</text>
<line x1="62" y1="288.0" x2="736" y2="288.0" stroke="#e2e2e2" stroke-width="1"/>
<text x="54" y="292.0" font-size="10.5" fill="#666666" text-anchor="end">0</text>
<line x1="62" y1="232.0" x2="736" y2="232.0" stroke="#e2e2e2" stroke-width="1"/>
<text x="54" y="236.0" font-size="10.5" fill="#666666" text-anchor="end">18</text>
<line x1="62" y1="176.0" x2="736" y2="176.0" stroke="#e2e2e2" stroke-width="1"/>
<text x="54" y="180.0" font-size="10.5" fill="#666666" text-anchor="end">35</text>
<line x1="62" y1="120.0" x2="736" y2="120.0" stroke="#e2e2e2" stroke-width="1"/>
<text x="54" y="124.0" font-size="10.5" fill="#666666" text-anchor="end">53</text>
<line x1="62" y1="64.0" x2="736" y2="64.0" stroke="#e2e2e2" stroke-width="1"/>
<text x="54" y="68.0" font-size="10.5" fill="#666666" text-anchor="end">70</text>
<line x1="62" y1="288" x2="736" y2="288" stroke="#999999" stroke-width="1"/>
<rect x="83.3" y="176.0" width="69.6" height="112.0" fill="#3b6ea5"><title>none: 35.2</title></rect>
<text x="118.2" y="170.0" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">35.2</text>
<text x="118.2" y="305.0" font-size="11" fill="#333333" text-anchor="middle">none</text>
<rect x="195.7" y="98.9" width="69.6" height="189.1" fill="#8c4a6e"><title>draft-mtp: 59.4</title></rect>
<text x="230.5" y="92.9" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">59.4</text>
<text x="230.5" y="305.0" font-size="11" fill="#333333" text-anchor="middle">draft-mtp</text>
<rect x="308.0" y="114.7" width="69.6" height="173.3" fill="#4a7c59"><title>draft-chain: 54.5</title></rect>
